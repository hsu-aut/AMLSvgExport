name: build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    # Windows, because the plugin targets net8.0-windows and WPF, and the tests
    # render WPF windows and use the installed Microsoft Edge.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: |
          dotnet restore Aml.Editor.Plugin.SvgExport.sln
          dotnet build Aml.Editor.Plugin.SvgExport.sln -c Release --no-restore

      - name: Test
        run: dotnet test Aml.Editor.Plugin.SvgExport.sln -c Release --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: Aml.Editor.Plugin.SvgExport-nupkg
          path: build/Plugins/Aml.Editor.Plugin.SvgExport/Release/*.nupkg

  check-version:
    # For a version tag only. The tag has to match the package version, or a tag
    # v0.9.0 would publish a 0.8.1 package.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aml.Editor.Plugin.SvgExport-nupkg
          path: nupkg

      - name: Check that the tag matches the package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "nupkg/Aml.Editor.Plugin.SvgExport.${version}.nupkg" || { ls nupkg; echo "no package for version ${version}"; exit 1; }

  nuget:
    # Publishes to nuget.org, where the AutomationML Editor finds the plugin under
    # PublicSource by its tag AMLEditorPlugin.Net. Trusted publishing: GitHub proves
    # the workflow's identity (OIDC) and nuget.org hands out a short-lived key, so no
    # API key is stored in the repository. A version on nuget.org cannot be replaced,
    # so the environment can require an approval before this job runs.
    needs: check-version
    runs-on: ubuntu-latest
    environment: nuget.org
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aml.Editor.Plugin.SvgExport-nupkg
          path: nupkg

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org account (profile name, not e-mail) that owns the trusted publishing policy.
          user: ${{ vars.NUGET_USER }}

      - name: Push the package
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  release:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aml.Editor.Plugin.SvgExport-nupkg
          path: nupkg

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nupkg/*.nupkg
          generate_release_notes: true
          fail_on_unmatched_files: true
